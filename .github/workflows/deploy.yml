name: 🚀 Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build React frontend and deploy to public_html/
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital-token-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd hospital-token-frontend
          npm ci

      - name: Build for production
        run: |
          cd hospital-token-frontend
          npm run build

      - name: Deploy Frontend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          source: "hospital-token-frontend/dist/assets,hospital-token-frontend/dist/index.html,hospital-token-frontend/dist/favicon.svg,hospital-token-frontend/dist/icons.svg,hospital-token-frontend/dist/images,hospital-token-frontend/dist/sample_patients_import.csv"
          target: "/home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/"
          strip_components: 2   # removes "hospital-token-frontend/dist/" prefix

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy Laravel backend to public_html/gmcc-api/
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: ⚙️ Deploy Backend (Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Backend via Rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.env' --exclude='vendor/' --exclude='storage/logs/' --exclude='storage/framework/cache/' --exclude='storage/framework/sessions/' --exclude='.git/'
          path: hospital-token-backend/
          remote_path: /home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/gmcc-api/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: 65002

      - name: Clear Laravel cache via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          script: |
            cd /home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/gmcc-api
            php artisan config:cache
            php artisan route:cache
            echo "✅ Cache cleared successfully"
