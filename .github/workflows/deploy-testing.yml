name: 🧪 Deploy to Hostinger (Testing)

on:
  push:
    branches:
      - testing          # Triggers on push to "testing" branch
  workflow_dispatch:     # Allows manual trigger from GitHub Actions UI

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build React frontend and deploy to Hostinger via SCP
  # ─────────────────────────────────────────────────────────
  deploy-frontend-testing:
    name: 🌐 Build & Deploy Frontend (Hostinger)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies & Build
        working-directory: ./hospital-token-frontend
        run: |
          npm ci
          npm run build

      - name: 🚀 Sync Frontend via SCP to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: 65002
          source: "hospital-token-frontend/dist/*"
          target: "/home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/"
          strip_components: 2

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy Laravel backend to Hostinger via SCP & SSH
  # ─────────────────────────────────────────────────────────
  deploy-backend-testing:
    name: ⚙️ Deploy Backend to Hostinger (Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, ctype, fileinfo, json, openssl, tokenizer, xml
          coverage: none

      - name: 📦 Install Composer Dependencies
        working-directory: ./hospital-token-backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs

      - name: 🚀 Sync Backend via SCP to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: 65002
          source: "hospital-token-backend/*"
          target: "/home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/gmcc-api/"
          strip_components: 1

      - name: 🔧 Clear Laravel Cache & Reset OPcache via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: 65002
          script: |
            BASEDIR=/home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/gmcc-api
            ln -sfn $BASEDIR/storage/app/public $BASEDIR/public/storage
            cd $BASEDIR
            rm -f bootstrap/cache/*.php
            php artisan optimize:clear || true
            php -r "if (function_exists('opcache_reset')) { opcache_reset(); echo 'OPcache reset'; }"
