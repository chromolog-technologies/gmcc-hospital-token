name: 🧪 Deploy to Hostinger (Testing)

on:
  push:
    branches:
      - testing          # Triggers on push to "testing" branch
  workflow_dispatch:     # Allows manual trigger from GitHub Actions UI

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build React frontend and deploy to Hostinger via SSH / Rsync
  # ─────────────────────────────────────────────────────────
  deploy-frontend-testing:
    name: 🌐 Build & Deploy Frontend (Hostinger)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies & Build
        working-directory: ./hospital-token-frontend
        run: |
          npm ci
          npm run build

      - name: 🔑 Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

      - name: 🚀 Sync Frontend via Rsync
        run: |
          PORT=65002
          HOST="${{ secrets.HOSTINGER_SSH_HOST }}"
          USER="${{ secrets.HOSTINGER_SSH_USERNAME }}"
          TARGET="/home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/"
          
          rsync -avz -e "ssh -p $PORT -o StrictHostKeyChecking=no" hospital-token-frontend/dist/ $USER@$HOST:$TARGET

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy Laravel backend to Hostinger via SSH / Rsync
  # ─────────────────────────────────────────────────────────
  deploy-backend-testing:
    name: ⚙️ Deploy Backend to Hostinger (Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

      - name: 🚀 Sync Backend via Rsync
        run: |
          PORT=65002
          HOST="${{ secrets.HOSTINGER_SSH_HOST }}"
          USER="${{ secrets.HOSTINGER_SSH_USERNAME }}"
          TARGET="/home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/gmcc-api/"

          rsync -avz -e "ssh -p $PORT -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='.git/' \
            hospital-token-backend/ $USER@$HOST:$TARGET

      - name: 🔧 Clear Laravel Cache & Reset OPcache via SSH
        run: |
          PORT=65002
          HOST="${{ secrets.HOSTINGER_SSH_HOST }}"
          USER="${{ secrets.HOSTINGER_SSH_USERNAME }}"
          
          ssh -p $PORT -o StrictHostKeyChecking=no $USER@$HOST "
            BASEDIR=/home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/gmcc-api
            ln -sfn \$BASEDIR/storage/app/public \$BASEDIR/public/storage
            cd \$BASEDIR
            rm -f bootstrap/cache/*.php
            php artisan optimize:clear || true
            php -r \"if (function_exists('opcache_reset')) { opcache_reset(); echo 'OPcache reset'; }\"
          "
