name: 🚀 Deploy to cPanel (BigRock)

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build React frontend and deploy to public_html/
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital-token-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd hospital-token-frontend
          npm ci

      - name: Build for production
        run: |
          cd hospital-token-frontend
          npm run build

      - name: Deploy Frontend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          source: "hospital-token-frontend/dist/assets,hospital-token-frontend/dist/index.html,hospital-token-frontend/dist/favicon.svg,hospital-token-frontend/dist/icons.svg,hospital-token-frontend/dist/images,hospital-token-frontend/dist/sample_patients_import.csv,hospital-token-frontend/dist/robots.txt,hospital-token-frontend/dist/sitemap.xml"
          target: "/home1/gmcchaav/public_html/"
          strip_components: 2   # removes "hospital-token-frontend/dist/" prefix

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy Laravel backend to public_html/gmcc-api/
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: ⚙️ Deploy Backend (Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Backend via Rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.env' --exclude='vendor/' --exclude='storage/logs/' --exclude='storage/framework/cache/' --exclude='storage/framework/sessions/' --exclude='.git/' --exclude='storage/app/firebase_credentials.json' --exclude='storage/app/public/'
          path: hospital-token-backend/
          remote_path: /home1/gmcchaav/public_html/gmcc-api/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: 2222

      - name: Run migrations & clear Laravel cache via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            BASEDIR=/home1/gmcchaav/public_html/gmcc-api
            # Create storage symlink
            ln -sfn $BASEDIR/storage/app/public $BASEDIR/public/storage
            cd $BASEDIR
            # Install/update composer dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            # Clear bootstrap cache
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            # Run fresh migrations (safe with --force on fresh DB)
            php artisan migrate --force
            # Cache config and routes for performance
            php artisan config:cache
            php artisan route:cache
            echo "✅ Deploy complete"
