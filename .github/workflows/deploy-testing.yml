name: 🧪 Deploy to Hostinger (Testing)

on:
  push:
    branches:
      - testing          # Triggers on push to "testing" branch
  workflow_dispatch:     # Allows manual trigger from GitHub Actions UI

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build React frontend and deploy to Hostinger via FTP
  # ─────────────────────────────────────────────────────────
  deploy-frontend-testing:
    name: 🌐 Build & Deploy Frontend (Hostinger)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies & Build
        working-directory: ./hospital-token-frontend
        run: |
          npm ci
          npm run build

      - name: 🚀 Deploy Frontend via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./hospital-token-frontend/dist/
          server-dir: /
          dangerous-clean-slate: false

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy Laravel backend to Hostinger gmcc-api/
  # ─────────────────────────────────────────────────────────
  deploy-backend-testing:
    name: ⚙️ Deploy Backend to Hostinger (Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, ctype, fileinfo, json, openssl, tokenizer, xml
          coverage: none

      - name: 📦 Install Composer Dependencies
        working-directory: ./hospital-token-backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs

      - name: 📄 Upload bootstrapper scripts
        run: |
          curl -v --ftp-create-dirs -T hospital-token-backend/public/unzip.php -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/gmcc-api/public/unzip.php"
          curl -v --ftp-create-dirs -T hospital-token-backend/public/clear_cache.php -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/gmcc-api/public/clear_cache.php"

      - name: 📦 Package Backend into ZIP
        run: |
          cd hospital-token-backend
          zip -r ../backend.zip . -x "node_modules/*" "tests/*" ".git/*" ".github/*" "storage/logs/*" "storage/framework/sessions/*"

      - name: 🚀 Upload Backend ZIP via FTP
        run: |
          curl -v -T backend.zip -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/gmcc-api/backend.zip"

      - name: 🔓 Trigger Remote Unzip & Cache Clear
        run: |
          curl -fs "https://api.gmcchtsrtoken.chromologtechnologies.com/unzip.php?token=Gmcchaav123"
          curl -fs "https://api.gmcchtsrtoken.chromologtechnologies.com/clear_cache.php?token=Gmcchaav123"
