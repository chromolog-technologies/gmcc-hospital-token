name: 🧪 Deploy to Hostinger (Testing)

on:
  push:
    branches:
      - testing          # Only triggers on the "testing" branch — never touches cPanel
  workflow_dispatch:     # Also allows manual trigger from GitHub Actions UI

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build React frontend and deploy to Hostinger public_html/
  # ─────────────────────────────────────────────────────────
  deploy-frontend-testing:
    name: 🌐 Build & Deploy Frontend (Hostinger)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital-token-frontend/package-lock.json

      - name: 📦 Install dependencies
        run: |
          cd hospital-token-frontend
          npm ci

      - name: 🔨 Build for production
        run: |
          cd hospital-token-frontend
          npm run build

      - name: 🚀 Deploy Frontend via SCP to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: 65002
          source: "hospital-token-frontend/dist/assets,hospital-token-frontend/dist/index.html,hospital-token-frontend/dist/favicon.svg,hospital-token-frontend/dist/icons.svg,hospital-token-frontend/dist/images,hospital-token-frontend/dist/sample_patients_import.csv,hospital-token-frontend/dist/robots.txt,hospital-token-frontend/dist/sitemap.xml"
          target: "/home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/"
          strip_components: 2   # removes "hospital-token-frontend/dist/" prefix

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy Laravel backend to Hostinger gmcc-api/
  # ─────────────────────────────────────────────────────────
  deploy-backend-testing:
    name: ⚙️ Deploy Backend to Hostinger (Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Deploy Backend via Rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.env' --exclude='vendor/' --exclude='storage/logs/' --exclude='storage/framework/cache/' --exclude='storage/framework/sessions/' --exclude='.git/' --exclude='storage/app/firebase_credentials.json' --exclude='storage/app/public/'
          path: hospital-token-backend/
          remote_path: /home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/gmcc-api/
          remote_host: ${{ secrets.HOSTINGER_SSH_HOST }}
          remote_user: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          remote_key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          remote_port: 65002

      - name: 🔧 Clear Laravel cache & run migrations via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: 65002
          script: |
            BASEDIR=/home/u818464796/domains/gmcchtsrtoken.chromologtechnologies.com/public_html/gmcc-api
            # Create storage symlink (exec() disabled on Hostinger so can't use artisan storage:link)
            ln -sfn $BASEDIR/storage/app/public $BASEDIR/public/storage
            cd $BASEDIR
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            php artisan config:cache
            php artisan route:cache
            echo "✅ Hostinger testing deploy complete"
