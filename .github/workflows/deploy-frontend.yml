name: Build and Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'hospital-token-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies & Compile Build
        working-directory: ./hospital-token-frontend
        run: |
          npm ci
          npm run build

      - name: Deploy Compiled Files via FTP
        uses: sebastianpopp/ftp-action@v2.0.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: ./hospital-token-frontend/dist
          remoteDir: ./
          forceSsl: false
