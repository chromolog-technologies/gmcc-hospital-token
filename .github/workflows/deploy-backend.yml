name: Build and Deploy Backend to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'hospital-token-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

jobs:
  backend-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, ctype, fileinfo, json, openssl, tokenizer, xml
          coverage: none

      - name: Install Composer Dependencies
        working-directory: ./hospital-token-backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Upload unzip.php bootstrapper
        run: |
          curl -v --ftp-create-dirs -T hospital-token-backend/public/unzip.php -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/gmcc-api/public/unzip.php"

      - name: Package Backend into ZIP
        run: |
          cd hospital-token-backend
          zip -r ../backend.zip . -x "node_modules/*" "tests/*" ".git/*" ".github/*" "storage/logs/*" "storage/framework/sessions/*"

      - name: Upload ZIP via curl
        run: |
          curl -v -T backend.zip -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/gmcc-api/backend.zip"

      - name: Trigger Remote Unzip
        run: |
          curl -fs "https://api.gmcchtsrtoken.chromologtechnologies.com/unzip.php?token=Gmcchaav123"
